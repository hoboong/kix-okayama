<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="오카야마 가는 길">
<title>오카야마 가는 길</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1f;--sub:#6b6b70;--line:#e3e1dc;--acc:#c8102e;--soft:#fbeaec;--sign:#1f2a44;--signink:#fff;--note:#fff6dc;--noteink:#5c4a00;--qr:#d0021b}
@media (prefers-color-scheme:dark){:root{--bg:#121214;--card:#1e1e21;--ink:#f2f2f4;--sub:#9c9ca3;--line:#2e2e33;--acc:#ff5a6e;--soft:#3a1d22;--sign:#0b1020;--note:#3a3214;--noteink:#f3e3a6}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:18px/1.55 -apple-system,"Apple SD Gothic Neo",sans-serif;padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 96px)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.phase{font-size:14px;font-weight:700;color:var(--acc)}
.count{font-size:14px;color:var(--sub)}
.bar{height:6px;background:var(--line);border-radius:3px;margin:8px 0 14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
h1{font-size:25px;line-height:1.3;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 12px}
.lbl{font-size:13px;font-weight:700;color:var(--sub);margin-bottom:6px}
.sign{display:inline-block;background:var(--sign);color:var(--signink);border-radius:8px;padding:6px 12px;margin:2px 6px 4px 0;font-weight:700;font-size:20px}
.sign small{font-weight:500;font-size:14px;opacity:.85;margin-left:6px}
.sign.qr{background:var(--qr)}
.note{background:var(--note);color:var(--noteink);border-radius:12px;padding:12px 14px;font-size:16px;margin:0 0 12px}
ol{margin:0;padding-left:22px}
ol li{margin:5px 0}
b.hl{color:var(--acc)}
.show{width:100%;font:inherit;font-weight:700;padding:14px;border-radius:12px;border:2px solid var(--ink);background:var(--card);color:var(--ink);margin-bottom:12px}
a.lnk{display:block;text-align:center;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;margin:0 0 8px;font-weight:600}
svg.map{width:100%;height:auto;display:block}
svg.map text{font:600 13px -apple-system,sans-serif;fill:var(--ink)}
svg.map .s{font-weight:500;font-size:11px;fill:var(--sub)}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:10px 16px calc(env(safe-area-inset-bottom) + 10px);background:var(--bg);border-top:1px solid var(--line)}
.nav button{font:inherit;border-radius:12px;padding:14px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.nav .back{flex:0 0 64px}
.nav .help{flex:0 0 84px;color:var(--acc);font-weight:700}
.nav .next{flex:1;background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700;font-size:19px}
.nav button:disabled{opacity:.4}
.sheet{position:fixed;inset:0;background:var(--bg);overflow:auto;padding:calc(env(safe-area-inset-top) + 12px) 16px 40px;display:none;z-index:5}
.sheet.on{display:block}
.close{float:right;font:inherit;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.big{position:fixed;inset:0;background:#fff;color:#000;z-index:9;display:none;flex-direction:column;justify-content:center;padding:24px;text-align:center}
.big.on{display:flex}
.big .ja{font-size:30px;font-weight:800;line-height:1.5}
.big .ko{font-size:16px;color:#555;margin-top:18px}
.big .hint{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 16px);left:0;right:0;font-size:14px;color:#888}
.list button{display:block;width:100%;text-align:left;font:inherit;padding:14px;margin:0 0 8px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.list button span{display:block;font-size:14px;color:var(--sub)}
.tiny{font-size:13px;color:var(--sub)}
</style>
</head>
<body>

<div class="top"><span class="phase" id="phase"></span><span class="count" id="count"></span></div>
<div class="bar"><i id="bar"></i></div>
<main id="step"></main>

<nav class="nav">
  <button class="back" id="back" aria-label="이전 단계">◀</button>
  <button class="help" id="helpBtn">도움</button>
  <button class="next" id="next">했어요 · 다음 ▶</button>
</nav>

<section class="sheet" id="help" aria-label="도움">
  <button class="close" data-close>닫기</button>
  <h1>도움이 필요할 때</h1>
  <div class="lbl">직원에게 화면 보여주기 (누르면 크게 나와요)</div>
  <div class="list" id="cards"></div>
  <div class="note"><b>신칸센을 놓쳤어도 괜찮아요.</b> 지정석 표는 같은 날 뒤 열차의 <b>자유석(自由席)</b> 칸에 탈 수 있는 게 기본 규칙이에요. 먼저 역 직원에게 「열차 놓침」 화면을 보여주세요.</div>
  <div class="lbl">지도</div>
  <a class="lnk" id="hotelLink" target="_blank" rel="noopener">구글지도: 오카야마역 → 워싱턴 호텔 (걷기)</a>
  <div class="lbl">긴급 연락</div>
  <a class="lnk" href="tel:110">경찰 110</a>
  <a class="lnk" href="tel:119">구급·화재 119</a>
  <a class="lnk" href="tel:+82232100404">영사콜센터 (24시간, 한국어)</a>
  <div class="lbl" style="margin-top:16px">원하는 단계로 이동</div>
  <div class="list" id="toc"></div>
</section>

<div class="big" id="big" role="dialog"><div class="ja" id="bigJa"></div><div class="ko" id="bigKo"></div><div class="hint">화면을 누르면 닫혀요</div></div>

   note:'新神戸 신고베 → (열차에 따라 姫路 히메지) → 그다음이 오카야마.'},
  {p:3, h:'이 안내가 나오면 내릴 준비', signs:['まもなく 岡山 <small>Okayama</small>'],
   todo:['객차 앞쪽 전광판에 「岡山 Okayama」','방송: 「まもなく、岡山です」 / 영어 「Okayama」','<b class="hl">「姫路 Himeji」 또는 「新神戸」 다음 역</b>','짐·QR·좌석 안내 종이 챙겨서 문 앞으로']},
  {p:4, h:'「出口」를 따라 개찰구로, 신칸센 QR로 나가요', signs:['出口 <small>Exit</small>','東口 <small>East Exit</small>'],
   todo:['계단·에스컬레이터로 내려가 「出口」 표지 따라가기','「QR」 표시 개찰구에 신칸센 QR 대고 나가기','<b class="hl">「乗換口(환승)」라고 적힌 개찰구는 피하기</b>'],
   card:'qrgate'},
  {p:4, h:'「東口 East Exit」로 나가요', signs:['東口 <small>East Exit</small>','後楽園 <small>방면</small>'],
   todo:['역 건물 밖으로 나오면 큰 광장과 노면전차(路面電車)','헷갈리면 아래 「도움」 → 구글지도']},
  {p:4, h:'걸어서 약 5분: 오카야마 워싱턴 호텔 플라자', signs:['桃太郎大通り <small>모모타로 대로</small>'],
   todo:['노면전차가 다니는 큰 길(모모타로 대로)을 따라가요','<b class="hl">1층에 로손(LAWSON)·미쓰이스미토모 은행</b>이 있는 건물','아래 버튼으로 걷는 길 안내 보기'],
   link:true, card:'hotel',
   note:'도착하면 연락 주세요! 수고하셨어요.'}
];

const HOTEL_URL = 'https://www.google.com/maps/dir/?api=1&origin=' + encodeURIComponent('岡山駅') + '&destination=' + encodeURIComponent('岡山ワシントンホテルプラザ') + '&travelmode=walking';

const store = {
  get(k, d){ try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
const $ = id => document.getElementById(id);
let cur = Math.min(store.get('step2', 0), STEPS.length - 1);

function render(){
  const s = STEPS[cur];
  $('phase').textContent = PHASES[s.p];
  $('count').textContent = `${cur+1} / ${STEPS.length}`;
  $('bar').style.width = ((cur+1) / STEPS.length * 100) + '%';
  $('step').innerHTML =
    `<h1>${s.h}</h1>` +
    (s.signs ? `<div class="card"><div class="lbl">이 글자를 찾으세요</div>${s.signs.map(x=>`<span class="sign${s.qr?' qr':''}">${x}</span>`).join('')}</div>` : '') +
    `<div class="card"><div class="lbl">할 일</div><ol>${s.todo.map(x=>`<li>${x}</li>`).join('')}</ol></div>` +
    (s.map ? `<div class="card"><div class="lbl">신오사카 3층 약도</div>${SHIN_OSAKA_MAP}</div>` : '') +
    (s.link ? `<a class="lnk" href="${HOTEL_URL}" target="_blank" rel="noopener">🗺 구글지도로 걷는 길 보기</a>` : '') +
    (s.card ? `<button class="show" data-card="${s.card}">📱 직원에게 보여주기: ${CARDS[s.card].t}</button>` : '') +
    (s.note ? `<div class="note">${s.note}</div>` : '');
  $('back').disabled = cur === 0;
  $('next').disabled = cur === STEPS.length - 1;
  $('next').textContent = cur === STEPS.length - 1 ? '도착 완료 🎉' : '했어요 · 다음 ▶';
}
function go(i){ cur = Math.max(0, Math.min(STEPS.length - 1, i)); store.set('step2', cur); render(); window.scrollTo(0, 0); }

$('next').onclick = () => go(cur + 1);
$('back').onclick = () => go(cur - 1);
$('helpBtn').onclick = () => $('help').classList.add('on');
document.querySelector('[data-close]').onclick = () => $('help').classList.remove('on');
$('hotelLink').href = HOTEL_URL;
$('cards').innerHTML = Object.entries(CARDS).map(([k,c]) => `<button data-card="${k}">${c.t}<span>${c.ko}</span></button>`).join('');
$('toc').innerHTML = STEPS.map((s,i) => `<button data-goto="${i}">${i+1}. ${s.h}<span>${PHASES[s.p]}</span></button>`).join('');
document.addEventListener('click', e => {
  const c = e.target.closest('[data-card]'), g = e.target.closest('[data-goto]');
  if (c) { $('bigJa').innerHTML = CARDS[c.dataset.card].ja; $('bigKo').textContent = CARDS[c.dataset.card].ko; $('big').classList.add('on'); }
  if (g) { go(+g.dataset.goto); $('help').classList.remove('on'); }
});
$('big').onclick = () => $('big').classList.remove('on');
render();
</script>
</body>
</html>
